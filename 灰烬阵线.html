<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倒计时：灰烬阵线 · 全文阅读器</title>
<style>
  :root{
    --prose-size:17px;
    --ink:#3a2d1f;
    --ink-soft:#6b563f;
    --paper:#f4ead3;
    --paper-deep:#e4d3b0;
    --ember:#ff8a3d;
    --ember-glow:#ffb26b;
    --gold:#d3942e;
    --gold-deep:#a9721f;
    --coal:#17120c;
    --coal-soft:#241b10;
    --accent:#c96f2c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
    background:radial-gradient(1200px 700px at 50% -10%,#3a2816 0%,#241b10 45%,#120d07 100%);
    color:var(--ink);overflow:hidden;
  }
  /* ===== 灰烬粒子氛围 ===== */
  #embers{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .ember{
    position:absolute;bottom:-10px;border-radius:50%;
    background:radial-gradient(circle,#ffd9a8 0%,var(--ember) 40%,rgba(255,138,61,0) 70%);
    filter:drop-shadow(0 0 6px rgba(255,138,61,.6));
    opacity:0;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0);opacity:0}
    8%{opacity:.85}
    85%{opacity:.5}
    100%{transform:translateY(-110vh) translateX(var(--drift,30px));opacity:0}
  }
  .grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
    background-image:repeating-radial-gradient(circle at 20% 30%,rgba(255,255,255,.03) 0 1px,transparent 1px 26px),
                     repeating-radial-gradient(circle at 80% 70%,rgba(0,0,0,.05) 0 1px,transparent 1px 34px);}
  /* ===== 顶部栏 ===== */
  #topbar{
    position:fixed;top:0;left:0;right:0;height:58px;z-index:30;
    display:flex;align-items:center;gap:14px;padding:0 18px;
    background:linear-gradient(180deg,rgba(20,14,7,.92),rgba(20,14,7,.35));
    backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,170,90,.18);
    color:#f0d9b0;
  }
  #topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:2px;white-space:nowrap}
  #topbar .brand .flame{font-size:20px;color:var(--ember-glow);text-shadow:0 0 12px var(--ember)}
  #topbar .brand small{display:block;font-weight:400;font-size:11px;color:#c4a06a;letter-spacing:4px}
  .toolbar{margin-left:auto;display:flex;align-items:center;gap:8px}
  .tb-btn{
    background:rgba(255,170,90,.08);border:1px solid rgba(255,170,90,.25);color:#f0d9b0;
    padding:7px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;
    transition:.2s;display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .tb-btn:hover{background:rgba(255,170,90,.18);border-color:rgba(255,170,90,.5);transform:translateY(-1px)}
  .tb-btn:active{transform:translateY(0)}
  .font-ctrl{display:flex;align-items:center;gap:2px;background:rgba(255,170,90,.08);
    border:1px solid rgba(255,170,90,.25);border-radius:8px;overflow:hidden}
  .font-ctrl button{background:none;border:none;color:#f0d9b0;padding:7px 9px;cursor:pointer;font-size:15px}
  .font-ctrl button:hover{background:rgba(255,170,90,.18)}
  #chTicker{min-width:110px;text-align:center;font-size:13px;color:#e7c795;letter-spacing:1px;font-variant-numeric:tabular-nums}
  /* ===== 封面 ===== */
  #cover{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(1400px 900px at 50% 20%,#3b2a17 0%,#241b10 50%,#0e0a05 100%);
    cursor:pointer;transition:opacity .8s,visibility .8s;
  }
  #cover.hide{opacity:0;visibility:hidden;pointer-events:none}
  .cover-inner{position:relative;max-width:820px;padding:0 22px}
  #cover .badge{
    display:inline-block;letter-spacing:8px;font-size:13px;color:#e7b26a;
    border:1px solid rgba(231,178,106,.5);padding:8px 22px;border-radius:30px;margin-bottom:30px;
    animation:breath 4s ease-in-out infinite;
  }
  @keyframes breath{0%,100%{box-shadow:0 0 0 rgba(255,138,61,0)}50%{box-shadow:0 0 34px rgba(255,138,61,.55)}}
  #cover h1{
    font-size:clamp(44px,9vw,86px);line-height:1.05;color:#ffe9c2;
    text-shadow:0 4px 40px rgba(255,138,61,.45),0 0 80px rgba(255,150,70,.25);
    letter-spacing:6px;font-weight:900;
  }
  #cover .sub{font-size:clamp(14px,2.4vw,18px);color:#d9b27f;letter-spacing:10px;margin-top:18px;font-weight:300}
  #cover .divider{width:240px;height:1px;margin:34px auto;background:linear-gradient(90deg,transparent,var(--ember),transparent);position:relative}
  #cover .divider::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;transform:translate(-50%,-50%) rotate(45deg);background:var(--ember);box-shadow:0 0 16px var(--ember)}
  #cover .synopsis{font-size:15px;color:#b8915d;line-height:2.2;max-width:560px;margin:0 auto}
  #cover .synopsis b{color:#f0c98d;font-weight:600}
  #cover .volumes{display:flex;gap:14px;justify-content:center;margin:30px 0 12px;flex-wrap:wrap}
  #cover .vol{font-size:13px;color:#d8ac74;border:1px solid rgba(216,172,116,.35);padding:8px 18px;border-radius:20px;letter-spacing:2px}
  #cover .btn-start{
    margin-top:38px;display:inline-flex;align-items:center;gap:12px;
    font-size:17px;letter-spacing:6px;color:#241b10;background:linear-gradient(135deg,var(--ember-glow),var(--ember));
    padding:14px 46px;border-radius:40px;border:none;font-family:inherit;font-weight:700;cursor:pointer;
    box-shadow:0 12px 44px rgba(255,138,61,.45);animation:breath 3s ease-in-out infinite;transition:transform .2s;
  }
  #cover .btn-start:hover{transform:translateY(-3px) scale(1.03)}
  #cover .scroll-hint{margin-top:34px;color:#7c6240;font-size:12px;letter-spacing:3px;animation:breath 3s ease-in-out infinite}
  /* ===== 书 ===== */
  #stage{position:fixed;top:58px;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:center;perspective:2200px}
  .book{
    position:relative;width:min(1120px,92vw);height:min(76vh,640px);
    transform-style:preserve-3d;
  }
  .book-shadow{position:absolute;left:6%;right:6%;bottom:-8px;height:70px;
    background:radial-gradient(ellipse at center,rgba(0,0,0,.5),transparent 70%);filter:blur(10px);z-index:0}
  .spread{
    position:absolute;inset:0;display:flex;transform-style:preserve-3d;
    background:radial-gradient(circle at 0 0,var(--paper-deep),var(--paper) 60%);
    border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 0 60px rgba(120,80,20,.12);
  }
  /* 脊柱 */
  .spine{position:absolute;left:50%;top:0;bottom:0;width:2px;z-index:6;
    background:linear-gradient(180deg,transparent,rgba(90,55,15,.5) 20%,rgba(90,55,15,.6) 80%,transparent);}
  .spine::before,.spine::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(160,110,45,.25)}
  .spine::before{transform:translateX(-4px)} .spine::after{transform:translateX(4px)}
  .leaf{flex:1;position:relative;padding:38px 40px;overflow:hidden}
  .leaf-left{background:linear-gradient(90deg,var(--paper-deep),var(--paper) 55%,#f0e6cf);border-radius:6px 0 0 6px}
  .leaf-right{background:linear-gradient(90deg,#f0e6cf,var(--paper) 45%,var(--paper-deep));border-radius:0 6px 6px 0}
  .leaf-right .col::-webkit-scrollbar{width:9px}
  .leaf-right .col::-webkit-scrollbar-thumb{background:rgba(150,105,40,.35);border-radius:6px;border:2px solid var(--paper)}
  .leaf-right .col::-webkit-scrollbar-track{background:transparent}
  .col{height:100%;overflow-y:auto;padding-right:8px;scroll-behavior:smooth}
  .scroll-track{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(160,110,45,.15);z-index:7}
  .scroll-fill{height:100%;width:0;background:linear-gradient(90deg,var(--ember-glow),var(--ember));box-shadow:0 0 8px var(--ember)}
  /* 翻页覆盖页 */
  .turn-leaf{
    position:absolute;right:0;top:0;width:50%;height:100%;z-index:20;
    transform-origin:left center;backface-visibility:hidden;
    background:linear-gradient(90deg,#f0e6cf,var(--paper) 45%,var(--paper-deep));
    border-radius:0 6px 6px 0;display:none;box-shadow:-14px 0 30px rgba(0,0,0,.28);
  }
  .turn-leaf.on{display:block}
  .turn-leaf .pg-turn{margin:38px 34px;height:calc(100% - 76px);color:var(--ink-soft);font-size:14px;line-height:2}
  /* 卷标 / 章节信息（左页） */
  .volchip{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:4px;color:var(--gold-deep);
    border:1px solid rgba(169,114,31,.5);padding:5px 14px;border-radius:20px;margin-bottom:20px}
  .ch-num{font-family:Georgia,serif;font-size:72px;line-height:1;color:var(--gold);opacity:.85;font-weight:700;margin-bottom:4px}
  .ch-of{color:var(--affect,--ink-soft);font-size:13px;letter-spacing:3px;margin-bottom:14px}
  .ch-title{font-size:34px;line-height:1.25;color:var(--ink);font-weight:900;letter-spacing:2px;margin-bottom:16px}
  .ch-title .cn{display:block;font-family:"Noto Serif SC",serif}
  .epigraph{border-left:3px solid var(--gold);padding:4px 0 4px 16px;margin:18px 0;font-size:calc(var(--prose-size,17px) - 3px);color:var(--ink-soft);line-height:1.9;font-style:italic}
  .epigraph cite{display:block;margin-top:8px;font-size:12px;font-style:normal;color:#a6834d;letter-spacing:2px}
  .ch-tags{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}
  .ch-tags span{font-size:12px;color:#7c5a2e;border:1px solid rgba(124,90,46,.35);padding:4px 12px;border-radius:16px;letter-spacing:1px}
  .leaf-note{position:absolute;left:40px;bottom:26px;font-size:12px;color:#a6834d;letter-spacing:2px}
  .leaf-note .pgno{font-family:Georgia,serif;font-size:13px}
  /* 正文（右页） */
  .prose{font-size:var(--prose-size,17px);line-height:2.1;color:var(--ink);text-align:justify}
  .prose p{margin:0 0 1.15em;text-indent:2em}
  .prose p:first-child::first-letter{
    float:left;font-size:58px;line-height:1;font-weight:900;color:var(--accent);
    padding:4px 10px 0 0;font-family:Georgia,serif;text-shadow:1px 1px 0 rgba(201,111,44,.2);
  }
  .prose .break{margin:2em 0;text-align:center;letter-spacing:12px;color:var(--gold);font-size:13px}
  /* 章节导航抽屉 */
  #drawer{
    position:fixed;top:58px;left:0;bottom:0;width:340px;max-width:86vw;z-index:35;
    transform:translateX(-105%);transition:transform .45s cubic-bezier(.65,0,.35,1);
    background:linear-gradient(180deg,rgba(28,20,11,.97),rgba(20,14,7,.98));
    border-right:1px solid rgba(255,170,90,.2);color:#e7c795;overflow-y:auto;padding:24px 20px;
    backdrop-filter:blur(10px);
  }
  #drawer.open{transform:translateX(0);box-shadow:30px 0 70px rgba(0,0,0,.5)}
  #drawer::-webkit-scrollbar{width:8px}
  #drawer::-webkit-scrollbar-thumb{background:rgba(255,170,90,.25);border-radius:6px}
  #drawer h3{font-size:13px;letter-spacing:4px;color:var(--ember-glow);margin:0 0 6px}
  .vol-group{margin:18px 0 4px}
  .vol-group .vname{font-size:14px;font-weight:700;letter-spacing:3px;color:#f0d9b0;margin-bottom:4px}
  .vol-group .vsub{font-size:11px;color:#9c7a4b;letter-spacing:2px;margin-bottom:8px}
  .vol-group .vline{height:1px;background:linear-gradient(90deg,rgba(255,170,90,.4),transparent);margin-bottom:8px}
  .ch-link{
    display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;
    transition:.18s;border:1px solid transparent;
  }
  .ch-link:hover{background:rgba(255,170,90,.08)}
  .ch-link.active{background:rgba(255,138,61,.16);border-color:rgba(255,170,90,.35)}
  .ch-link .ci{font-family:Georgia,serif;color:var(--gold);font-size:15px;min-width:26px}
  .ch-link .ct{font-size:14px;letter-spacing:1px;color:#e7c795}
  .ch-drawer-note{margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,170,90,.18);font-size:12px;color:#9c7a4b;line-height:2;letter-spacing:1px}
  /* 遮罩 */
  #shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:34;opacity:0;visibility:hidden;transition:.3s}
  #shade.on{opacity:1;visibility:visible}
  /* ===== 移动端竖屏 ===== */
  @media(max-width:820px) and (orientation:portrait){
    #topbar{height:48px;padding:0 10px;gap:6px}
    #stage{top:48px}
    .brand .flame{font-size:16px}
    .brand span:not(.flame):not(small){font-size:12px;letter-spacing:0}
    .brand small{display:none}
    #chTicker{min-width:auto;font-size:11px;letter-spacing:0;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .toolbar{gap:4px}
    .tb-btn{padding:6px 8px;font-size:12px}
    .font-ctrl button{padding:6px 7px;font-size:13px}
    .spine{display:none}
    .leaf-left{display:none}
    .leaf-right{border-radius:6px}
    .turn-leaf{width:100%;right:0}
    .book{width:96vw;height:min(85vh,720px)}
    .leaf{padding:22px 16px}
    .ch-num{font-size:44px}
    .ch-title{font-size:22px}
    .prose{line-height:2}
    .epigraph{font-size:calc(var(--prose-size,17px) - 4px)}
    #prevBtn,#nextBtn{padding:10px 8px;font-size:18px}
  }
  /* ===== 移动端横屏（低高度设备） ===== */
  @media(orientation:landscape) and (max-height:500px){
    #topbar{height:40px;padding:0 8px;gap:6px}
    #stage{top:40px}
    .brand .flame{font-size:14px}
    .brand small{display:none}
    .brand span:not(.flame):not(small){font-size:11px;letter-spacing:0}
    #chTicker{font-size:10px;min-width:auto;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .toolbar{gap:3px}
    .tb-btn{padding:4px 7px;font-size:11px}
    .font-ctrl button{padding:4px 5px;font-size:12px}
    .book{width:97vw;height:min(92vh,400px)}
    .leaf{padding:14px 12px}
    .ch-num{font-size:38px}
    .ch-title{font-size:20px}
    .ch-tags{margin-top:12px}
    .ch-tags span{font-size:10px;padding:3px 8px}
    .epigraph{font-size:calc(var(--prose-size,17px) - 4px);line-height:1.6;margin:10px 0}
    .prose{font-size:calc(var(--prose-size,17px) - 1px);line-height:1.85}
    .prose p:first-child::first-letter{font-size:42px}
    .leaf-note{font-size:10px;bottom:16px;left:12px}
    #prevBtn,#nextBtn{padding:6px 5px;font-size:14px}
  }
  /* ===== 沉浸模式（替代全屏） ===== */
  body.focus-mode #topbar{transform:translateY(-100%);transition:transform .4s ease}
  body.focus-mode #stage{top:0 !important}
  body.focus-mode #prevBtn,body.focus-mode #nextBtn{opacity:0;pointer-events:none;transition:opacity .3s}
  body.focus-mode #shade{display:none}
  body.focus-mode #fsBtn{position:fixed;top:8px;right:8px;z-index:50;opacity:.4;transition:opacity .3s}
  body.focus-mode #fsBtn:hover{opacity:1}
  @media(prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<!-- ===== 密码门 ===== -->
<div id="gate" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 50% -10%,#3a2816 0%,#241b10 50%,#0e0a05 100%);font-family:serif">
  <div style="text-align:center;max-width:380px;padding:0 20px">
    <div style="font-size:28px;color:#ffe9c2;letter-spacing:4px;margin-bottom:8px">灰烬阵线</div>
    <div style="font-size:12px;color:#9c7a4b;letter-spacing:6px;margin-bottom:28px">ASH FRONTLINE · PRIVATE</div>
    <input id="pwdInput" type="password" placeholder="输入阅读口令" style="width:240px;padding:12px 16px;font-size:16px;text-align:center;border:1px solid rgba(255,170,90,.4);border-radius:30px;background:rgba(255,255,255,.06);color:#f0d9b0;outline:none;font-family:serif;letter-spacing:2px" />
  <div id="pwdHint" style="margin-top:14px;font-size:12px;color:#c96f2c;min-height:18px;letter-spacing:1px"></div>
  <button id="pwdBtn" style="margin-top:18px;padding:10px 36px;font-size:15px;letter-spacing:4px;color:#241b10;background:linear-gradient(135deg,#ffb26b,#ff8a3d);border:none;border-radius:30px;font-family:serif;font-weight:700;cursor:pointer;box-shadow:0 8px 30px rgba(255,138,61,.4)">进入</button>
  </div>
</div>
<div class="grain"></div>
<div id="embers"></div>

<div id="cover">
  <div class="cover-inner">
    <div class="badge">灰 烬 纪 · 序 章</div>
    <h1>倒计时：灰烬阵线</h1>
    <div class="sub">ASH FRONTLINE</div>
    <div class="divider"></div>
    <p class="synopsis">
      内战撕裂黎明。西线部队困守泥沼，欧陆军团身陷重围，腐败的将军们把自己锁进首都，
      等待一场逃亡的电梯。而普莱斯手中只剩三千残兵、一条泥泞的通道，和一座
      <b>不断归零的机场</b>。斩首、潜伏、逼宫、封路——在灰烬落定之前，他必须把这场
      <b>政变</b>，烧成燎原。
    </p>
    <div class="volumes">
      <span class="vol">一卷 · 困局与破局</span>
      <span class="vol">二卷 · 潜伏与预期管理</span>
      <span class="vol">三卷 · 斩首与终局</span>
    </div>
    <button class="btn-start" id="btnStart">进入战场</button>
    <div class="scroll-hint">⚜ 点击任意处开始阅读 ⚜</div>
  </div>
</div>

<div id="topbar">
  <div class="brand">
    <span class="flame">☄</span>
    <span>倒计时：灰烬阵线<small>ASH FRONTLINE</small></span>
  </div>
  <div id="chTicker"></div>
  <div class="toolbar">
    <div class="font-ctrl">
      <button id="fontDec" title="缩小字号">A−</button>
      <button id="fontInc" title="放大字号">A+</button>
    </div>
    <button class="tb-btn" id="tocBtn">☰ 书目</button>
    <button class="tb-btn" id="fsBtn" title="全屏">⛶</button>
  </div>
</div>

<button class="tb-btn" id="prevBtn" style="position:fixed;left:14px;top:50%;z-index:25;transform:translateY(-50%);padding:14px 12px">‹</button>
<button class="tb-btn" id="nextBtn" style="position:fixed;right:14px;top:50%;z-index:25;transform:translateY(-50%);padding:14px 12px">›</button>

<div id="shade"></div>
<aside id="drawer"></aside>

<div id="stage">
  <div class="book" id="book">
    <div class="book-shadow"></div>
    <div class="spread" id="spread">
      <div class="spine"></div>
      <div class="leaf leaf-left" id="leafLeft"></div>
      <div class="leaf leaf-right" id="leafRight">
        <div class="col" id="proseCol"></div>
        <div class="scroll-track"><div class="scroll-fill" id="scrollFill"></div></div>
      </div>
    </div>
    <div class="turn-leaf" id="turnLeaf"><div class="pg-turn" id="turnContent"></div></div>
  </div>
</div>

<script>
/* ===== 密码门 ===== */
const GATE_PWD="ash2026"; // ← 改这里换口令
(function(){
  const g=document.getElementById("gate");
  const inp=document.getElementById("pwdInput");
  const btn=document.getElementById("pwdBtn");
  const hint=document.getElementById("pwdHint");
  function tryPwd(){
    if(inp.value===GATE_PWD){
      g.style.transition="opacity .6s";g.style.opacity="0";
      setTimeout(()=>g.remove(),600);
    }else{hint.textContent="口令不对，再试试";inp.value="";inp.focus();}
  }
  btn.onclick=tryPwd;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")tryPwd();});
})();

/* ============================================================
   小说数据：倒计时：灰烬阵线
   基于手稿《战斗经过与政变纪要》扩展为三卷十章
   ============================================================ */
const NOVEL = [
{
  vol:"第一卷", vsub:"困局与破局", n:1,
  title:"困敦之夜",
  epigraph:"雨把所有的路都泡软了。指挥部像一只病猫，蜷在泥里，隔着一千公里发号施令。",
  tag:["西线泥沼","雨夜","心理博弈","86小时余"],
  p:[
    "雨是从天还没黑就开始下的，下到后来已经不是雨，是一种能渗进骨头缝里的、黏稠的冷。桑葚镇东边一公里的那条野战壕，积了齐踝深的泥浆，火把映在泥面上，像几粒将熄的残星。洛伊蹲在壕沿，把最后半截烟咬在嘴里，没用火，烟早就潮透了。他只是需要咬着点什么，好让上下牙不磕出声音。",
    "普莱斯站在镇口那棵火烧过的槐树下，听着雨砸在钢盔上的声音。他听了一个多月了，从西线开始，从一路退到这里，从八千人的军号变成三千人的点名。参谋在身后举着防水地图，那地图已经被雨泡得起毛，像一片发霉的肺叶。",
    "“八翼指挥部来电，将军。”参谋的声音压得很低，“他们命令我们——原地固守，等待‘欧陆军团’整编后驰援。他们说，最迟七十二小时。”",
    "普莱斯没有回头。他知道瓦西里参谋在等一个答复，也知道千里之外那座指挥部的人不想听真话。八翼——那座由一群军校教员和文职幕僚组成的最高指挥部，从战火蔓延的第一天起，就没有一个人到过前线五十公里以内。他们在地图上画箭头，把漂亮的线画到每一个他们以为还存在的据点。",
    "“七十二小时。”普莱斯重复了一遍这个数字，声音里没有火气，也没有嘲笑，“从什么时候开始算？”",
    "“……从他们发出这道命令开始，将军。”",
    "“那就是说，我们得在这片烂沼泽里，用三千双快磨穿的靴子，撑住至少三天，等一支我们谁也不确定还存不存在的‘军团’。”他顿了顿，终于转回头，雨水顺着他的眉骨滴下来，“瓦西里，你信那道命令吗？”",
    "参谋没有回答。但他放下地图的手，在伞盖下微微抖了一下。",
    "不是冷。是怕。",
    "那种怕，普莱斯见过太多次了。在那些被围困的夜里，人不是被敌人的炮火击垮的，是被“等待”两个字慢慢磨垮的。等待会放大一切：等待会让每一道命令都变得可疑，会让每一个没有音讯的友邻都变成传说，会让三千个背靠背的男人，在泥地里长出各自的名字以前，先长出各自的疑心。",
    "“传我命令。”普莱斯开口，声音不高，却足够所有人都抬起头，“把伤员的雨布集中起来，先给老兵和炮兵。炊事班的口粮，改成一天两顿，一顿也不许少。今晚不转移。”",
    "“不转移？”火头军老马从熄灭的灶台后面探出半个脑袋。他已经准备了一夜，就等那句“撤退”的命令。他把两天的干粮塞在裤腿里，靴子也换成了不会打滑的那双。他认得战争的味道，这镇子今晚的味道——是被人盯上的味道。",
    "“不转移。”普莱斯说，“退，我们今晚必死。四面八方都是政府军的探子，我们一离开这镇子的掩体，就会在野地里被一口口咬掉。八翼让我们固守，我当然不信他们会来。可恰恰因为我不信——”他抬眼扫过在场每个油腻腻、泥糊糊、疲惫到近乎麻木的脸，“政府军也不信我们还有三千人。他们得到的线报，是我们已经残到只剩下两个连，龟缩待毙，等着被歼灭。”",
    "老马张了张嘴，那双常年看火的眼睛慢慢亮起来。“……那咱们就让天底下都以为，我们真的只剩两个连？”",
    "“这叫空城计，老马。”参谋瓦西里终于接上话，声音里带上了一丝热度，“可空城计，是拿命去赌城里的灯亮。我们赌的是——”",
    "“我们赌的，是雨。”普莱斯望向东边那片浓得化不开的黑暗，“雨会把我们的脚印冲干净，会把所有的路都泡软，政府军的装甲支队在泥里开不动。今晚，是我们的人身最疲、也最安全的时刻。因为敌人同样疲惫，也以为我们疲惫得只剩下躺着等死。”",
    "他不让自己说更多。有些计划，一旦出口，就会在这三千人的队伍里长脚，绕过所有的嘴，被一场夜雨之外的耳朵听见。他只在心里，给这场固守加上了一个真正的名字——它不是等待，它是一场反向的猎杀。",
    "后半夜，雨小了。营地安静得像一座坟，口令声此起彼伏，却压得极低。普莱斯没有睡。他坐在那棵槐树下，摊开那页被雨水泡软的地图，用炭笔，一笔，一笔，画出那条他早就在脑海里走过一百遍的路：向西，穿越密林，绕过边境小村，贴着政府军防线的背面，一直通向——乌克兰斯克。",
    "他知道，那座城市里，有人欠着他一个天大的机会。而在那之前，他只有一个念头，反复碾过他的胸腔：",
    "撑到天亮。把今晚的命，活着送进明天。",
    "<div class='break'>❖ ❖ ❖</div>",
    "天亮得比什么都慢。雨在五点时暂停，人们还没来得及松一口气，远处西边就传来了若有若无的履带声。不是轰鸣，是一种被泥地吸掉大半、闷闷的、碾着人心的响动。",
    "政府军的装甲，还是来了。",
    "普莱斯从槐树下站起来，把炭笔别回兜里，那页地图他看了整整一夜，现在上面多了一条他谁也没告诉的、通往未来的曲线。他跨过沟壑，踩过泥浆，走到阵地的最高处，那里的观察哨正架着炮队镜，镜子里，地平线上浮起了几点铁灰色的影子。",
    "“将军，”哨兵的声音发抖，却咬着牙没回头，“他们……他们一个营都不止。”",
    "“我知道。”普莱斯说。他抬手，把盔带扣紧，声音平静得像在宣布开饭，“传令下去——所有人，做好他们的样子。”",
    "那天，三千人做起了两个连的样子。火光被压到最低，口令改成哑哨，重武器全都藏进了秸秆垛，只有两门老式的多管炮露在外面，炮口对准那条泥路，仿佛那就是西线部队最后的、垂死的一点火气。政府军的尖兵，在望远镜里看到的，正是一支疲惫、绝望、只求临死一搏的小部队。",
    "他们踏进了那片泥泞。他们不知道，等着他们的，是三千个守在暗处、身上糊满泥巴、眼里却没有一丝睡意的人。",
    "普莱斯站在槐树下，没有下令开火。他只是看着，等着，等他们踩得再深一点，深到那片被雨泡软的地，把他们每一个动作都放慢成慢动作的那一刻。",
    "战前的倒计时，在他心里，从这一秒开始走。"
  ]
},
{
  vol:"第一卷", vsub:"困局与破局", n:2,
  title:"被抛弃的五百人",
  epigraph:"要让整支大军看见他们，就要先让整支大军以为，他们只剩一个连。",
  tag:["空城计","五百敢死","反侦察","佯动"],
  p:[
    "凌晨四点，雨彻底停了。雾气从泥地里蒸起来，把桑葚镇的轮廓泡成一团灰影。政府军的装甲先头，就停在那片被水漫过的麦田边，距镇子不到两公里。他们的炮队镜架了一夜，看到的火光是那样的少，那样稀，少得让观察手都起了疑心——这是被困的部队，还是已经悄悄溜空的壳？",
    "普莱斯在撤退前，做了一件任何人都不肯做的决定。他在镇中心那间烧了半边的磨房里，把五百个人面对面地召到了一起。不是命令，是摊牌。",
    "“我要带两千五百人，从东北面的峡谷穿插出去。”他声音沙哑，一字一句，“留下你们的任务，比逃出去更难。你们要用一百个人，装成一支还在移动的万人大军；你们要让政府军相信，我们的大部队正沿着西线大道往后退，退进那片他们早就在那里布好口袋的密林。”",
    "队伍里静默了一瞬。然后是货真价实的问句，从老兵的口里炸开：“将军，一万人的动静，一百个人怎么造得出来？”",
    "普莱斯把自己那本脏兮兮的行军日志翻开，摊在地上。里面夹着一张他自己画的、狗爬一样的示意——不是炮兵的图，是给演活计的戏班看的说明书。",
    "“炮声。”他说，“我们有两门还能响的旧多管炮，外加从废弃弹药库里拖出来的一百条雷管。人不够，就让炮响、让火燃、让铁砸进铁里。一百个人，只要足够‘响’，就能让对面把一支‘师’运到西线去喂口袋。领头的不是别人——是伊万。”",
    "“伊万？”瓦西里参谋失声。伊万不是军中的人。他是去年冬天投诚过来的政府军前参谋，一个在密林和沼泽里活得像鼹鼠的男人，没有人真正信过他，也没有人在最要紧的关头敢不镇他一眼。",
    "“就因为他不是军中的人。”普莱斯看着众人，“政府军知道西线的几个人，可他们不知道伊万的底牌。没关系，他们也不需要知道——他们只需要相信那一百个人是一万。”",
    "<div class='break'>❖ ❖ ❖</div>",
    "天光乍亮。那门破多管炮，真的响了。",
    "声音是伊万调的。他让炮手把药量压到平时的一半，炸点埋进泥里，好让响声又闷又重——闷得像是从一整片阵地里同时冒出来。一轮齐射后，他亲自带人点起了一排火堆，把民兵的军旗横七竖八地插在田垄上，又让那匹据说是团长坐骑的、瘦得只剩下骨头的老马，绑着一串铁皮桶，在雾里拖着跑。铁桶撞着石头，叮当——叮当——像是一整个车队在调动。",
    "他一边造这些假象，一边骂。骂天，骂地，骂这满嘴泥巴的日子。可他骂得越狠，手上的活越利索。因为他比谁都清楚，戏做足了，对面才会真的调转枪口，去追一个不存在的军。",
    "政府军的装甲果然动摇了。它们在麦田边停住，炮队镜不断报回“西线方向有大规模调动”“疑似重装单位过桥”“征用的车队正往密林方向回溯”的讯息。那些讯息从营级传到旅级，再从旅级沿着电报线，一路发回那座所有命令都过于谨慎的首都。",
    "黄昏时分，政府军装甲主力作出了决定——转向西进，去封堵那个“正在退入密林的万人军”。整个下午，一百个人用自己的嗓子、自己的雷管、自己的破铁桶，把整整一个师级的判断，从真正的东面峡谷，拨向了西边的沼泽。",
    "伊万趴在镇口的一堆瓦砾后面，目送那一条铁灰色的长龙碾过大路把扬起的尘土颠末，鼻子里全是柴油和硝烟味。他啐了一口唾沫，就那么目送他们一步步走远，喉咙里滚过一句谁也听不清的话。",
    "“走吧，都走吧。这一夜，够我讲半辈子。”",
    "他留在的最后一块阵地上，只有他自己，和一百个自愿留下的人。他们的后路，已经没有任何一条了——真正的五千精兵(其实只有两千五)正从峡谷里无声地移动，而他们的名字，会在天亮后彻底消失在这个镇子的犄角旮旯里，成为一份悬在西线指挥部墙上的、永远得不到回应的“阵亡名单”。",
    "<div class='break'>❖ ❖ ❖</div>",
    "至少，普莱斯是这样对自己说的。他一路走，一路告诉自己：镇子上那五百个人，是五百个已经死了的人。只有尽快逃出这片泥沼，才配得上他们用命换来的那一点点时间。",
    "可他知道，这话骗不了自己。他把伊万留下，是留了一个必然的死局；而他把希望留下，是留在了那片泥里，让它的光，足以照亮东北方向那条通向峡谷的路。他抬头，看见夜空一片浑浊，星光全无，只有远处的雾霭里，若有若无地，传来一声接一声、低低的铁桶相撞的叮当声。",
    "那声音追着他，追了很久。"
  ]
},
{
  vol:"第一卷", vsub:"困局与破局", n:3,
  title:"血色穿插",
  epigraph:"峡谷没有路。迷雾会替勇敢的人开路，也会替鲁莽的人挖墓。",
  tag:["峡谷穿插","迷雾潜行","悬崖突袭","两千五"],
  p:[
    "东北的峡谷，是一条裂在地图上的旧伤疤。八十年前那场大洪水把它撕开，此后再也没有人修过它。两壁几乎垂直，最窄处只容两骑并行，谷底乱石如牙，一年里有大半年浸在齐腰的溪水里。若非伊万在投诚后、画下那卷精确到步数的《峡谷测图》，普莱斯绝不会把这两千五百条命，押进这样一道罅缝。",
    "入谷时已是深夜。队伍呈单列，像一条细长的、被夜色吞掉尾巴的黑蛇，贴着崖壁一寸寸往深处游。雾气从谷底涌起来，先是膝盖高，后来是腰，最后把人整个浸在一种黏稠的、看不见自己的灰白里。士兵们只能扶着前一个人的背，摸着军装上传来的体温，确定自己还活着、还在走。",
    "他们不敢点灯。凡是外露的光，在这样一条安静得能听见自己心跳的狭谷里，都等于把整支队伍的位置递给敌人。可黑暗也有黑暗的危险。走在最前面的侦察兵，几次差点跌进那些被水冲出来的暗坑；有一次，一个士兵没踩实，整个人滑了下去，身后的战友硬是用一条绑腿把他拽了回来，两人在乱石上滚成一团，谁也没敢喊出声，只是牙关里咬着血，把那一声闷哼咽回了肚子里。",
    "“还有多远？”普莱斯低声问身侧的向导，声音被雾吞了一半。",
    "向导是个本地猎人，被队伍半请半拉地带来。他伸出三根手指，又收回一根。“按图，天亮前能摸到中段的那个豁口。豁口上面，”他顿了顿，指了指雾气遮蔽的头顶，“是政府军一个守峡观察哨。过去了，我们就进了密林腹地，谁也追不上我们了。”",
    "普莱斯没有接话。他把那卷测图在脑子里又过了一遍：豁口，是这条峡谷唯一能一级级攀上崖顶的拐点，也是唯一可能被掐断的死结。若守哨的敌人多，或者预警及时，这两千五百人就会像钻进铁罐的耗子，被一锅端在谷底。",
    "天将破晓的时候，队伍抵近了豁口。雾在那一刻诡异地散开一线，露出崖顶那架用原木搭成的观察哨轮廓——哨位上有人影晃动，不止一个，至少有一挺轻机枪的枪口，斜斜地对准谷底这条唯一的通路。",
    "普莱斯盯着那架机枪，脑子里的盖革针咔咔作响。他不打算硬闯。他抬头，看见崖顶的雾气最浓处，有一片塌了半边的裂缝，像是某个世纪以前，山体自己松开的一道牙缝。",
    "“找二十个手脚最利索的。”他压低声音，眼睛没有离开那条裂缝，“跟我，从豁口右侧的崖缝攀上去。从上面，把他们的后脑勺，一个个敲开。剩下的人，留在谷底，掐断他们的退路。要快，要静——天亮以前，这片山里，不能有人活着把信号打出去。”",
    "<div class='break'>❖ ❖ ❖</div>",
    "攀崖是一场与重力、湿滑和恐惧的拔河。二十个人贴着崖壁，指甲抠进石缝，一寸一寸地向上。绳子不能用太响的金属扣，只能用粗麻布裹着树皮，一段段接力。爬到一半，有人踩落一块碎石，碎石滚落崖壁，在静得拧得出水的峡谷里，嗒——的一声，清脆得像一声枪响。",
    "崖顶哨位上，一个人影探了出来，手电的光柱往裂缝方向扫了两下。光柱落在普莱斯藏身的豁口处，停住了一秒。那一秒，普莱斯连呼吸都停了。他能感觉到光柱的温度，能感觉到自己悬在半空、只需指头一松就会摔成肉泥的脆弱。",
    "光柱移开了。手电的主人转回身，骂了一句谁也听不懂的方言，大概是在抱怨这该死的天气。没有任何一个敌人，会把这道绝壁之上的裂缝，当作一支军队的通路。",
    "直到最后一个攀崖者翻上崖沿前，普莱斯已经在崖顶趴了整整半个小时。他看清了哨位的布置：三个人在外棚，两个人窝在里面打盹，机枪架在门口。入夜的下弦月把那一片照得半明半暗——正是下手的好光。",
    "他抬手，比了个手势。二十个人如同他们脚下的暗影，无声地涌了上去。匕首的反光只闪了一瞬，就被袍子压住。不到三分钟，两个打盹的敌人永远睡了下去；另外三个在惊醒的刹那，被闷倒、被捆死，甚至没能呼叫，就被抹了脖子。整个哨位，落入了一种近乎病态的安静——只有风，还在哨棚的门缝间呜咽。",
    "普莱斯最后检查了一遍，确认没有活口能放信号，才把那个被钉死在哨牌上的旧信号棒，一脚踢下崖去。他靠着机枪座一侧的石墙，喘了许久。然后，他回头，隔着那片渐渐化开的雾，望向东边——那方向，是他笃定要活下去的方向。",
    "谷底的两千五百人，在得到信号后，像涨潮一样漫过了豁口，没入浓雾。当他们最后一个脚青年的身影消失，从桑葚镇方向，若有若无地，传来一声低沉的撤炮声——那是伊万的铁桶，在替他们把最后一个谎，撒向密林。",
    "普莱斯没有回头。他只在那块哨石上，用刀尖刻下三个粗糙的字——不是名字，不是记号，而是一个提醒:" ,      
    "“猜不到，死在后头。”"
  ]
},
{
  vol:"第一卷", vsub:"困局与破局", n:4,
  title:"撤退的代价",
  epigraph:"一支被取消番号的军队，比一支被打光的军队更让士兵寒心。",
  tag:["欧陆军团溃败","政治博弈","重组二十人","收容伤员"],
  p:[
    "他们用了四天三夜，才从密林腹地磨到乌克兰斯克的外围。雨断了又续，鞋底磨穿了一层，干粮见了底，有两公里路是派前哨赤着脚蹚过一片沼泽才探明的。等望见城市边缘那排废弃的输电塔时，两千五百人里，已有近两百个再也没能爬起来——不是战死，是饿的、病的、被泥和疲惫一点点吸干的。",
    "乌克兰斯克是一座被战争踩了几脚、却没有真正塌下来的边境城。它一半归政府军管辖，一半落在各方势力犬牙交错的灰色地带。城北的旧军营里，驻扎着名义上仍属于“欧陆军团”的一支残部。这个名字，曾经是这片战线上许多人最后的指望——可现在，它已经烂得只剩下一个空壳。",
    "当普莱斯率部抵达军营门口时，看到的不是迎接的军容，而是一场正在进行的争吵。欧陆军团的督军、一个肚圆脸肥、镶着金牙的军官，正指着院墙里一片被拆得七零八落的营房，对新来的几个幕僚骂骂咧咧。那些幕僚是从首都来的，公文叠得整整齐齐，泥点都没沾一个。他们的来意说得很清楚：",
    "“欧陆军团的编制，自此刻起正式取消。剩余兵力并入东部守备队，接受总指挥部——也就是八翼——的重新调度。普莱斯将军千里驰援之请，不予批准；其部，即日起列册，等待清点，不得擅自行动。”",
    "院子里，那些原本还撑着一点精神的欧陆老兵，脸色一个接一个地灰了下去。他们等了一个多月的援兵，等来的是自己的葬礼通知——一支打了半年仗、只剩下八百号残兵的部队，就这么被一支从没上过战场的笔，整整齐齐地划掉了。",
    "<div class='break'>❖ ❖ ❖</div>",
    "普莱斯站在军营门口，把那纸公文翻来覆去看了三遍。他没有摔，没有骂，只是看完后，把它折好，别回那位幕僚的怀里。他说：“公文我收下了。但我部两千五百人，是拿命从对面防线里爬出来的。请回告八翼——清点，可以；缴械，不可能。”",
    "“将军——”那位幕僚还想说什么。",
    "“我认得你身上的墨味，先生。”普莱斯打断他，“你没挨过枪子。那我也不跟你废话。你去告诉八翼，他的决定，会让我们所有人，这辈子都没法活着睡个整觉。”",
    "幕僚灰着脸走了。伊万的铁桶声，早在前一晚就彻底消失了——桑葚镇方向传来一场爆响后，就再没有音讯。普莱斯没有等那个结果。他在军营后院的伤兵棚里，一夜之间，收拢了从欧陆军团残部里愿意跟他走的每一个伤员、每一个老兵、每一个还想记住自己番号的人。",
    "八百个欧陆老兵里，跟他走的，不足六十个；而这六十个里，能立刻上阵的，只有二十人。这二十个人，被他重新编成了一个袖珍的名册，在磨秃了的登记簿上，写下了一支新队伍的第一个名字——没有正式番号，只是在封皮上，用炭笔刻下两个字：残部。",
    "“从今天起，你们不属任何一环，也不欠任何一支军。”普莱斯在临时搭起的棚子中间，声音不高，却穿透了整个草棚，“你们只欠一个人——欠你们自己，一个能好好活到明天的理由。给伤员换药的人不够，自己动手；认得路的，去探沟渠；能走的老兵，来领队伍。我们没有军饷，没有番号，没有人在身后替我们作保。我们只有彼此的背，和这条不能退的路。”",
    "雨又下起来，砸在棚顶上。草棚里没有一个人出声哭。哭是有力气的人才有的奢侈。可当普莱斯蹲下身，亲手去解一名年轻伤员已经烂在腿上的绑带时，那青年忽然抓着他的手，哑着嗓子问了一句：",
    "“将军……我们到底，还要往哪里撤？”",
    "普莱斯没有立刻回答。他抬起头，望向东南方。那里，隔着两道防线、一片山麓、一座还亮着灯的首都，有一个锈迹斑斑的旧机场，静静趴在夜的边缘。那是这座城市里最后一只，还能起飞的眼睛。",
    "“不撤了。”他说，“撤，撤到哪里都死。该轮到我们，反着走。”",
    "他把那卷旧地图在膝上摊开，炭笔在新编的“残部”二字旁边，又落下三个字——那是一场将来的总攻，一个在所有人心里，都还远得遥不可及的名字：",
    "首都。"
  ]
},
{
  vol:"第二卷", vsub:"潜伏与预期管理", n:5,
  title:"山麓的幽灵",
  epigraph:"在敌人眼皮底下，把一支被打散的队伍，重新养成一支敢反扑的军队——这是最难的仗，也是最闷的仗。",
  tag:["三周整训","士气重塑","夜色交涉","灰色地带"],
  p:[
    "乌克兰斯克城外的山麓没有名字。地图上，它只是一片横亘在首都和边境之间的深绿色色块，被几道无名沟壑切开。普莱斯把他的“残部”撒进了这片山麓，一住，就是三个星期。",
    "这三周里，他做的最多的事，不是练兵，而是“让人重新相信自己还活着”。头几天，整支队伍像一群刚从坟里爬出来的活尸，人还站着，魂还留在桑葚镇的泥里、留在大峡谷的雾气里、留在那二十个被削掉了名字的欧陆老兵身上。伤兵棚里的呻吟比枪声更摧人。",
    "普莱斯不喊口号。他在山坳的松树下搭了个露天的“课堂”，每天黄昏，把伤愈的人、能走的人都叫到跟前，不讲兵法，只做一件事——点名，认人。他一个个念名字，念到谁的伤还疼，谁的家还在战区，谁饿了三天没吃上一口热的，他都记下来。他记得住每一个名字，像是要给这片山麓，重新种出一个家。",
    "“我叫普莱斯。”他在队伍中间这样说，“我不是你们的将，也不欠你们一个番号。我是那个把你们从泥里带出来的人，我只对一件事负责——就是想办法，让尽可能多的人，活着看见这场仗打完。今天多活一个，明天就多一分赢的指望。”",
    "队伍里的士气，就是这样一点一点，从骨头缝里重新长出来的。到第二周，已经有人自愿在黑夜里练枪、练手语、练那种在密林里不发出一点声音的移动。山麓的夜晚，从此多了一群无声的“幽灵”。",
    "<div class='break'>❖ ❖ ❖</div>",
    "同这三周的练兵同时进行的，是一场更隐秘的交涉。乌克兰斯克虽然名义上仍在政府的灰色管辖里，可真正握着这座城命门的人，是一群早已不再相信任何政权的本地势力——城东贩运粮食的马帮、掌控着货运码头的一名老修车匠、以及一个据说与各方都有往来的女人，人们叫她“寡妇院长”。",
    "普莱斯没有直接去找他们。他派瓦西里参谋，带着三条干肉、一壶酒和一封只用铅笔写的信，去拜码头。信上只有一句话：“山高皇帝远的地方，只有互相抬轿，才不会一起摔死。给条路，我给枪；给个脸，我给命。”",
    "马帮的头子，是个精瘦而多疑的老者。他摩挲着那壶酒，反复打量瓦西里，最后吐出一句模棱两可的话：“行路的人，只看谁给的路通。你们要是真能截下政府军一批军火，规规矩矩分我三成，这条路，我就给你们留着。”",
    "那一夜，瓦西里带着这句话回去时，普莱斯只问了一个问题：“他是不是还漏看了一个价码？”",
    "瓦西里迟疑了一下：“……他说，还想再见一次‘那位让你们活下来的寡妇院长’。”",
    "普莱斯没有笑，也没有发火。他想了很久，最终说：“那就请她来。”他顿了顿，“但告诉她，这次不是借路——是问她一句话：首都那座机场，她到底能替我们留下多少？”",
    "因为普莱斯清楚，乌克兰斯克只是起点，他的目光，始终没有离开过东南方向那座还亮着灯的首都，和它身边那个锈迹斑斑、却从未熄灭的机场。他要在那里，做一件让所有人都觉得他疯了的事。"
  ]
},
{
  vol:"第二卷", vsub:"潜伏与预期管理", n:6,
  title:"调虎离山",
  epigraph:"要骗过猛虎，就得先让它以为，猎物正朝着自己的胸口，慌不择路地撞来。",
  tag:["第一梯队","佯溃诱敌","千人大戏","拉锯消耗"],
  p:[
    "第三周末，伊斯塔河大桥方向，忽然亮起一整片火光。不是燃烧弹，是普莱斯让第一梯队的鬼火——一千个最会说谎的老兵，打出的“溃退”。",
    "这出戏，他和瓦西里排练了整整十天。一千个人，分作几拨，故意用白天能看清的队形，慌慌张张地从山麓的几道豁口涌出来，冲向东南方向那座政府军控制的运输站。他们一边跑，一边丢东西：丢下的不是空壳，是一批他精心准备好的“假辎重”——印着番号的空弹箱、几台还能走两步、又“恰巧”坏掉的货车，以及一份“遗落”的、写满撤退路线的作战地图。",
    "那张地图是假的，可它够真。上面用炭笔画着一条从山麓直插首都侧后的“秘密通道”，还标了几处“重兵待援”“弹药库”“油料囤积”的假目标。普莱斯要的就是让政府军的参谋部看见这张图，然后，让他们的判断，全部扑向这条他画出来的、根本不存在的路。",
    "政府军的反应，比他预想的还要快。这个被一支“溃军”吓得误判的庞大机器，几乎是立刻倾巢而动，把驻守首都外围的精锐师，一拨一拨地掉头，沿着那条“秘密通道”的方向，气势汹汹地追进了深山——去封堵一支正在“撤退”的、实际上根本不存在的部队。",
    "第一梯队的“溃退”，就这样变成了一场长达四天四夜的拉锯消耗战。他们且战且走，专挑密林和溪谷，把追击的政府军主力，一步步牵进山的更深处。他们打两枪，换一个地方；点一堆篝火，又立刻摸黑转移。用一千条命，在深山里，拖出了一支整整一师的劳顿、疲惫和积攒了一路的怒意。",
    "<div class='break'>❖ ❖ ❖</div>",
    "到第四天黄昏，第一梯队终于完成了他们的任务——把政府军主力，彻底钉在了深山里，让它既够不着首都，也回不了头。就在这个当口，普莱斯发出了那道如同掷下骰子般的命令：",
    "第二梯队，一千人，趁夜出山。",
    "这支整整养了一个月、像幽灵一样藏在山麓里的队伍，终于要走向他的猎物。他们的目标，是一座此刻已经几乎被抽空了守备的首都——以及那座，正在夜色里等着一盏灯、一个信号的机场。",
    "临出发前，普莱斯在篝火边，最后一次核对那座他魂牵梦萦的机场距离表。倒计时，又往前走了一天。"
  ]
},
{
  vol:"第二卷", vsub:"潜伏与预期管理", n:7,
  title:"暗夜无声",
  epigraph:"最锋利的刀，是插进一颗刚相信自己安全了的心里的刀。",
  tag:["第二梯队","无声潜行","近战收割","吃掉一百"],
  p:[
    "那座首都的门户，是一座建在河湾边的老城堡改成的营垒。政府军在这里，留了一百名守军。这一百人，是整个防线上最后一道还醒着的门闩——他们刚从山里被抽回城，还没回过神，就被告知“城外平安，只要守住这一夜”。",
    "普莱斯的第二梯队，就在这一百个人以为最安全的那个深夜，摸到了城堡外。",
    "他们在密林里，已经练了将近一个月“不发出声音的行走”。此刻，这一千零一个幽灵，沿着河道的水声作掩护，像渗进水里的墨，一寸寸地浸透了城外的每一处阴影。没有人说话，没有人用火，连咳嗽都被含在嘴里、压在肘弯里。领头的尖兵，只用手指和眼神，就把队伍引到了城墙下那道被常年侵蚀、露出黄泥的暗渠口。",
    "那是一道只有肩宽的水渠，半截埋在水里。尖兵们几乎是跪着身子，从齐胸的凉水里，一个一个地拱了进去。水流的声音，恰好盖住了他们每个人压抑的呼吸。",
    "城内的哨兵，隔一盏油灯，正歪在墙根打盹。他的枪斜靠在一边，鼾声断断续续。尖兵是最后一个爬上渠沿的，他在泥水里蹲了好一会儿，才缓慢起身，像一只真正贴近了猎物的猫——先是站起身，再从墙拐的阴影里，摸到那个哨兵身后。",
    "匕首入鞘的那一瞬，连风都没惊动。鼾声停了，像一声被纱布揩掉的叹息。尖兵把他靠回墙根，让他看起来仍是那个熟睡的哨兵，然后腾出一只手，在墙上按死一点早已备好的灰，把血迹掩住。整个过程，没有一盏灯亮起。",
    "一百个人，是分十二拨，被那队幽灵一拨一拨“吃掉”的。有的在瞭望台，有的在伙房，有的在休息的铺位边。到天微微发光时，那座城堡里，已经没有一个还睁着眼的守军——只有一百具，还保持着“熟睡”姿势的躯体。",
    "第二梯队，一个没伤。他们用一夜，替普莱斯，悄悄合上了首都的最后一道门闩。",
    "当第一缕晨光越过城堡的垛口时，城里的政府将军们，还沉浸在“城外平安”的梦乡里。他们不知道，一支从山麓里养出来的幽灵，已经在天亮之前，站在了他们黄花城的门槛上——而这座城的倒计时，还剩最后三天。"
  ]
},
{
  vol:"第三卷", vsub:"斩首与终局", n:8,
  title:"装甲轰鸣",
  epigraph:"政变不需要请柬。它只需要装甲车把门，和一句没有人敢于先站起来反驳的沉默。",
  tag:["轻型装甲","政府大楼","领事馆","巷战"],
  p:[
    "首都的清晨，比任何一场战争都安静。政府军的将军们昨夜开了一整夜的会，争论着那支“在深山里被追剿的溃军”到底还剩多少残兵。他们争论到黎明，争论到眼皮发沉，谁也没有留意到，城北的街灯，一盏，接一盏地，灭了。",
    "那不是路灯坏了。那是普莱斯的第二梯队，用最无知无觉的方式，替这座城市合上了最后一道帘子。",

/* ================= 阅读引擎 ================= */
const $=id=>document.getElementById(id);
const state={cur:0,flip:false,font:17};

const htmlEscape=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* —— 灰烬粒子 —— */
(function spawnEmbers(){
  const host=$("embers");const n=innerWidth<720?16:30;
  for(let i=0;i<n;i++){
    const e=document.createElement("i");
    e.className="ember";
    const s=2+Math.random()*6;
    e.style.width=e.style.height=s+"px";
    e.style.left=Math.random()*100+"%";
    e.style.setProperty("--drift",(Math.random()*120-60)+"px");
    e.style.animationDuration=(6+Math.random()*9)+"s";
    e.style.animationDelay=(Math.random()*12)+"s";
    host.appendChild(e);
  }
})();

/* —— 渲染章节 —— */
function flyleafHtml(ch){
  const rn=["Ⅰ","Ⅱ","Ⅲ","Ⅳ","Ⅴ","Ⅵ","Ⅶ","Ⅷ","Ⅸ","Ⅹ"][ch.n-1]||ch.n;
  return `
    <div class="volchip">${htmlEscape(ch.vol)} · ${htmlEscape(ch.vsub)}</div>
    <div class="ch-num">${rn}</div>
    <div class="ch-of">第${ch.n}章</div>
    <h2 class="ch-title">${htmlEscape(ch.title)}</h2>
    <div class="epigraph">${ch.epigraph}</div>
    <div class="ch-tags">${ch.tag.map(t=>"<span>"+htmlEscape(t)+"</span>").join("")}</div>
    <div class="leaf-note">灰烬阵线 · <span class="pgno">${rn}</span>/${rn}</div>`;
}
function proseHtml(ch){
  return "<div class='prose'>"+ch.p.map(p=>p.startsWith("<")?p:"<p>"+p+"</p>").join("")+"</div>";
}
function render(i){
  const ch=NOVEL[i];
  $("leafLeft").innerHTML=flyleafHtml(ch);
  $("proseCol").innerHTML=proseHtml(ch);
  $("proseCol").scrollTop=0;updateFill();
  $("chTicker").textContent="第"+ch.n+"章 · 《"+ch.title+"》";
  updateActive(i);
}

/* —— 进度条 —— */
function updateFill(){
  const el=$("proseCol");const r=el.scrollHeight-el.clientHeight;
  const f=$("scrollFill");f.style.width=(r>0? (el.scrollTop/r*100):100)+"%";
}
$("proseCol").addEventListener("scroll",updateFill,{passive:true});

/* —— 翻页动画：右页翻折 —— */
function turnFolder(){ // 复位翻页叶
  const tl=$("turnLeaf");
  tl.style.transition="none";tl.style.transform="rotateY(0deg)";
  tl.classList.remove("on");tl.classList.remove("anim");
  void tl.offsetWidth;
}
function flipTo(i){
  if(state.flip||i===state.cur)return;
  if(i<0||i>=NOVEL.length)return;
  state.flip=true;
  const tl=$("turnLeaf");
  $("turnContent").innerHTML="<div class='prose'>"+NOVEL[state.cur].p.slice(-8).map(p=>p.startsWith("<")?p:"<p>"+p+"</p>").join("")+"</div>";
  turnFolder();
  tl.classList.add("on");
  void tl.offsetWidth;
  render(i);state.cur=i;
  requestAnimationFrame(()=>{
    tl.classList.add("anim");
    tl.style.transition="transform 1s cubic-bezier(.45,.05,.2,1)";
    tl.style.transform="rotateY(-179deg)";
  });
  tl.addEventListener("transitionend",function h(e){
    if(e.propertyName!=="transform")return;
    tl.removeEventListener("transitionend",h);
    turnFolder();state.flip=false;
  });
}
function go(i){flipTo(i);}

/* —— 书目抽屉 —— */
function buildDrawer(){
  const d=$("drawer");
  let h="<h3>☰ 全 书 章 目</h3>";
  let curVol="";
  NOVEL.forEach(ch=>{
    if(ch.vol!==curVol){
      curVol=ch.vol;
      h+=`<div class="vol-group"><div class="vname">${htmlEscape(ch.vol)}</div>
          <div class="vsub">${htmlEscape(ch.vsub)}</div><div class="vline"></div></div>`;
    }
    h+=`<div class="ch-link" data-i="${ch.n-1}"><span class="ci">${ch.n}</span><span class="ct">${htmlEscape(ch.title)}</span></div>`;
  });
  h+=`<div class="ch-drawer-note">⚜ 灰烬阵线 · 全书计 ${NOVEL.length} 章，分三卷<br>翻动右页 · 左右键 / 两侧按钮转场</div>`;
  d.innerHTML=h;
  d.querySelectorAll(".ch-link").forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i;
    if(i!==state.cur){flipTo(i);}
    toggleDrawer(false);
  });
}
function updateActive(i){
  $("drawer").querySelectorAll(".ch-link").forEach(el=>{
    el.classList.toggle("active",+el.dataset.i===i);
  });
}
function toggleDrawer(force){
  const open=typeof force==="boolean"?force:!$("drawer").classList.contains("open");
  $("drawer").classList.toggle("open",open);
  $("shade").classList.toggle("on",open);
}

/* —— 顶栏 & 控制 —— */
$("btnStart").onclick=()=>{$("cover").classList.add("hide");};
$("cover").onclick=e=>{ if(e.target.closest("input,button,a"))return; $("cover").classList.add("hide"); };
$("tocBtn").onclick=()=>toggleDrawer();
$("shade").onclick=()=>toggleDrawer(false);
$("prevBtn").onclick=()=>go(state.cur-1);
$("nextBtn").onclick=()=>go(state.cur+1);
document.addEventListener("keydown",e=>{
  if($("cover").classList.contains("hide")){
    if(e.key==="ArrowRight"||e.key==="PageDown")go(state.cur+1);
    else if(e.key==="ArrowLeft"||e.key==="PageUp")go(state.cur-1);
  }
});
$("fontDec").onclick=()=>setFont(state.font-1);
$("fontInc").onclick=()=>setFont(state.font+1);
function setFont(v){
  v=Math.max(14,Math.min(22,v));state.font=v;
  document.documentElement.style.setProperty("--prose-size",v+"px");
  localStorage.setItem("asfont",v);
}
$("fsBtn").onclick=()=>{
  const fm=document.body.classList.toggle("focus-mode");
  $("fsBtn").textContent=fm?"✕":"⛶";
  $("fsBtn").title=fm?"退出沉浸":"沉浸阅读";
};

/* —— 启动 —— */
(function init(){
  const saved=+localStorage.getItem("asfont");if(saved)state.font=Math.min(22,Math.max(14,saved));
  document.documentElement.style.setProperty("--prose-size",state.font+"px");
  buildDrawer();render(0);
})();
</script>
